id: default
display_name: Default
embedding:
  provider: mock
  huggingface_model: intfloat/multilingual-e5-small
  use_e5_instructions: true
retrieval:
  similarity_top_k: 20
  candidate_top_k: 60
  rerank:
    lexical_enabled: true
    token_overlap_weight: 0.003
    phrase_hit_weight: 0.02
    numeric_token_weight: 0.01
    max_phrase_size: 8
    min_phrase_size: 3
metadata:
  primary_ids:
    - doc_id
  recommended_filters:
    - doc_id
    - doc_type
    - business_flow
    - room_id
glossary: {}
stopwords:
  - tai
  - la
  - gi
  - cua
  - vao
  - luc
  - nao
  - va
