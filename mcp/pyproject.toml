[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pixels-mcp"
version = "0.1.2"
description = "MCP server that connects AI agents to a configurable RAG Pixels HTTP backend"
requires-python = ">=3.11,<3.15"
dependencies = [
  "httpx>=0.27.0",
  "mcp>=1.0.0",
  "python-dotenv>=1.0.1"
]

[project.scripts]
rag-pixels-mcp = "rag_pixels_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rag_pixels_mcp*"]
